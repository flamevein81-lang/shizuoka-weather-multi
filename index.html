      flex-wrap: wrap;
      gap: 12px;

      letter-spacing: 0.02em;
    }

      gap: 10px;
      padding: 14px 32px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
      background: var(--surface2);
      border: 1px solid var(--border);

    .badge-dot {

    .dot-normal  { background: var(--gray); }
    .dot-2024    { background: var(--blue); }
    .dot-2025    { background: var(--orange); }

      padding: 28px 24px;
      display: flex;
      flex-direction: column;

      border-radius: var(--radius);
      padding: 24px;
      position: relative;

      display: block;
      width: 3px;
      height: 16px;
      border-radius: 2px;
      background: var(--accent);
    }
    .chart-wrap {

      height: 340px;
    }

      font-size: 0.8rem;

      text-align: center;

      padding: 20px;
